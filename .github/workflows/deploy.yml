name: Deploy LFS to GitHub Pages

on:
  push:
    branches: ["main"] # 브랜치명이 다를 경우 수정하세요.

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      # 수정된 부분: steps:deployment -> steps.deployment (마침표 사용)
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # LFS 파일을 실제 바이너리 데이터로 가져오는 핵심 설정
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 프로젝트 루트 디렉토리를 배포 아티팩트로 업로드
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
